<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="aptelionTitle aptelionDesc">
  <title id="aptelionTitle">Aptelion Directed Path Mark</title>
  <desc id="aptelionDesc">A light geometric A mark for dark Aptelion surfaces.</desc>
  <defs>
    <linearGradient id="aptelionA" x1="20" y1="74" x2="76" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDF6FF" />
      <stop offset="0.48" stop-color="#4FC3E8" />
      <stop offset="1" stop-color="#2E7CF6" />
    </linearGradient>
    <filter id="softSignal" x="-24" y="-24" width="144" height="144" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4FC3E8" flood-opacity="0.22" />
    </filter>
  </defs>
  <g filter="url(#softSignal)">
    <path
      d="M20 74L43 25C45 20 51 20 53 25L76 74"
      fill="none"
      stroke="url(#aptelionA)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M36 67L48 48L60 67"
      fill="none"
      stroke="#F5F8FC"
      stroke-width="8.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
