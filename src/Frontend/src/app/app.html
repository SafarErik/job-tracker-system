<!-- Application Shell with Horizon brand background -->
<div
  class="relative min-h-screen w-full overflow-x-hidden bg-background text-foreground antialiased transition-colors duration-500 font-sans">
  <div class="pointer-events-none fixed inset-0 z-[-1] bg-[linear-gradient(135deg,hsl(var(--background))_0%,hsl(var(--surface-inset))_48%,hsl(var(--muted))_100%)] dark:bg-[linear-gradient(135deg,hsl(var(--background))_0%,hsl(var(--surface-inset))_52%,hsl(var(--brand-indigo))_100%)]"></div>
  <div class="pointer-events-none fixed inset-x-0 top-0 z-[-1] h-px bg-[linear-gradient(90deg,transparent,hsl(var(--brand-aurora)/0.55),transparent)]"></div>

  <div class="relative z-10 min-h-screen">
    <router-outlet></router-outlet>
  </div>

  <!-- Toast Notifications -->

  <!-- Confirm Dialog -->
  <app-confirm-dialog></app-confirm-dialog>

  <!-- Global Add Application Sheet -->
  <app-application-add-sheet />
  <!-- Global Toaster (Sonner) -->
  <ngx-sonner-toaster richColors position="bottom-right" [theme]="themeService.themeSetting()" />
</div>
