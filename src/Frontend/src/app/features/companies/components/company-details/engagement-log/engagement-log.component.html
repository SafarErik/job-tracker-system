<div class="space-y-4">
  <div class="flex items-center gap-3">
    <div class="p-2 rounded-xl bg-primary/10 text-primary">
      <ng-icon name="lucideUsers" class="h-5 w-5"></ng-icon>
    </div>
    <h3 class="text-sm font-black uppercase tracking-widest text-foreground font-serif">
      Personnel Radar
    </h3>
  </div>
  <div class="bg-card border-border rounded-3xl p-6">
    <app-contact-list
      [contacts]="contacts()"
      [maxDisplay]="3"
      (save)="saveContact.emit($event)"
      (deleteContact)="deleteContact.emit($event)"
    ></app-contact-list>
  </div>
</div>
