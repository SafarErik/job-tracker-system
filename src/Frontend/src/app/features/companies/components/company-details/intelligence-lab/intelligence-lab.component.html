<div class="space-y-4">
  <div class="flex items-center gap-3">
    <div class="p-2 rounded-xl bg-primary/10 text-primary">
      <ng-icon name="lucideSearch" class="h-5 w-5"></ng-icon>
    </div>
    <h3 class="text-sm font-semibold uppercase tracking-widest text-foreground">
      Research snapshot
    </h3>
  </div>

  <div
    class="p-8 rounded-lg bg-card border-border relative overflow-hidden group min-h-[220px] flex flex-col justify-between"
  >
    <div class="relative z-10">
      <div class="flex items-center justify-between mb-4">
        <span
          class="px-2 py-0.5 rounded bg-primary/10 text-[8px] font-semibold text-primary uppercase tracking-widest"
          >Active brief</span
        >
        <span class="text-[9px] font-bold text-muted-foreground">Company context</span>
      </div>
      @if (dossierSnippet()) {
        <p
          class="text-sm text-foreground leading-relaxed italic opacity-80 border-l-2 border-primary/30 pl-4 py-1"
        >
          "{{ dossierSnippet() }}"
        </p>
      } @else {
        <p class="text-xs italic text-muted-foreground py-4">
          No research brief yet. Run Vadis Guidance to build a company summary.
        </p>
      }
    </div>
    <div class="mt-6 flex justify-end relative z-10">
      <button
        (click)="openDossier.emit()"
        class="px-6 py-2.5 rounded-lg bg-primary/5 border border-primary/20 text-[10px] font-semibold uppercase tracking-[0.16em] text-primary hover:bg-primary/20 transition-all flex items-center gap-2"
      >
        Open research brief
        <ng-icon name="lucideChevronRight" class="h-3 w-3"></ng-icon>
      </button>
    </div>
  </div>
</div>
