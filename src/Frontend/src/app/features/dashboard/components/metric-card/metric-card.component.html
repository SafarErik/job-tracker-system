<article
  class="metric-card rounded-2xl border border-border/40 bg-linear-to-br from-card to-surface-raised p-4 backdrop-blur-md shadow-sm"
>
  <p class="text-[11px] uppercase tracking-[0.18em] text-muted-foreground">{{ label() }}</p>

  @if (variant() === 'gauge') {
    <div class="mt-3 flex items-center gap-3">
      <div
        class="relative h-14 w-14 rounded-full metric-gauge"
        [style.--gauge]="safeGaugeValue() + '%'"
      >
        <div class="absolute inset-1 rounded-full bg-background"></div>
      </div>
      <div
        class="metric-value text-3xl font-semibold"
        [class.metric-inactive]="inactive()"
        [class.metric-active]="!inactive()"
      >
        {{ value() }}
      </div>
    </div>
  } @else {
    <div
      class="metric-value mt-2 text-4xl font-semibold"
      [class.metric-glow]="variant() === 'glow'"
      [class.metric-inactive]="inactive()"
      [class.metric-active]="!inactive()"
    >
      {{ value() }}
    </div>
  }

  @if (variant() === 'sparkline') {
    <svg viewBox="0 0 220 56" class="mt-3 h-14 w-full">
      <polyline
        [attr.points]="sparklinePoints()"
        fill="none"
        stroke="var(--metric-gradient)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></polyline>
    </svg>
  }

  @if (subtitle()) {
    <p class="mt-2 text-xs text-muted-foreground">{{ subtitle() }}</p>
  }
</article>
