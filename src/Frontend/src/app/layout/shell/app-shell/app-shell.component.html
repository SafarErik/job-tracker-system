<div hlmSidebarWrapper class="flex min-h-screen bg-surface-inset text-foreground">
  <app-sidebar />
  <app-profile-settings-sheet />

  <main hlmSidebarInset class="relative flex min-w-0 flex-1 flex-col overflow-hidden bg-surface-inset">
    <div class="pointer-events-none absolute inset-0 overflow-hidden">
      <div
        class="absolute inset-x-0 top-0 h-40 bg-[linear-gradient(180deg,_hsl(var(--primary)/0.07),_transparent)]"
      ></div>
    </div>

    <header
      class="sticky top-0 z-30 border-b border-border/70 bg-background/85 px-3 py-2.5 backdrop-blur-xl sm:px-4 lg:px-6"
    >
      <div class="mx-auto flex w-full max-w-[1600px] items-center gap-3">
        <button
          hlmSidebarTrigger
          class="!h-9 !w-9 shrink-0 rounded-lg border border-border/70 bg-card/80 text-muted-foreground shadow-sm hover:border-accent/45 hover:bg-muted/60 hover:text-foreground"
          aria-label="Toggle sidebar"
        ></button>
        <app-global-header class="min-w-0 flex-1" />
      </div>
    </header>

    <div class="relative z-10 flex min-h-0 flex-1 flex-col overflow-hidden">
      <div class="flex-1 overflow-y-auto">
        <router-outlet />
      </div>

      <footer class="border-t border-border/70 bg-background/60 px-4 py-3 backdrop-blur sm:px-6">
        <div
          class="mx-auto flex max-w-[1600px] flex-col items-center justify-between gap-2 text-[11px] text-muted-foreground sm:flex-row"
        >
          <span class="font-medium uppercase tracking-[0.2em]">{{ 'shell.footerTitle' | transloco }}</span>
          <div class="flex items-center gap-4">
            <a href="#" class="hover:text-foreground transition-colors">Privacy</a>
            <a href="#" class="hover:text-foreground transition-colors">Terms</a>
            <a href="#" class="hover:text-foreground transition-colors">Support</a>
          </div>
        </div>
      </footer>
    </div>
  </main>

  <app-ai-drawer />
</div>
