<div hlmSidebarWrapper class="flex min-h-screen bg-background text-foreground">
  <app-sidebar />
  <app-profile-settings-sheet />

  <main hlmSidebarInset class="relative flex min-w-0 flex-1 flex-col overflow-hidden bg-background">
    <div class="pointer-events-none absolute inset-0 overflow-hidden">
      <div
        class="absolute inset-x-0 top-0 h-64 bg-[radial-gradient(circle_at_top,_hsl(var(--primary)/0.12),_transparent_58%)]"
      ></div>
      <div class="absolute -right-24 top-24 h-72 w-72 rounded-full bg-primary/6 blur-3xl"></div>
    </div>

    <header
      class="relative z-30 border-b border-border/70 bg-background/80 px-3 py-3 backdrop-blur-xl sm:px-4 lg:px-6"
    >
      <div
        class="mx-auto flex w-full max-w-[1600px] items-center rounded-[1.75rem] border border-border/60 bg-card/75 px-4 py-2 shadow-[0_20px_60px_hsl(var(--background)/0.45)] backdrop-blur-xl"
      >
        <button hlmSidebarTrigger class="mr-3"></button>
        <app-global-header class="min-w-0 flex-1" />
      </div>
    </header>

    <div class="relative z-10 flex min-h-0 flex-1 flex-col overflow-hidden">
      <div class="flex-1 overflow-y-auto">
        <router-outlet />
      </div>

      <footer class="border-t border-border/70 bg-background/60 px-4 py-3 backdrop-blur sm:px-6">
        <div
          class="mx-auto flex max-w-[1600px] flex-col items-center justify-between gap-2 text-[11px] text-muted-foreground sm:flex-row"
        >
          <span class="font-medium uppercase tracking-[0.2em]">{{ 'shell.footerTitle' | transloco }}</span>
          <div class="flex items-center gap-4">
            <a href="#" class="hover:text-foreground transition-colors">Privacy</a>
            <a href="#" class="hover:text-foreground transition-colors">Terms</a>
            <a href="#" class="hover:text-foreground transition-colors">Support</a>
          </div>
        </div>
      </footer>
    </div>
  </main>

  <app-ai-drawer />
</div>
