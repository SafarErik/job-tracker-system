<div
  class="grid w-full grid-cols-[minmax(0,1fr)_auto] items-center gap-3 lg:grid-cols-[minmax(0,1.2fr)_minmax(22rem,36rem)_auto]"
>
  <div class="min-w-0">
    <p class="text-[10px] font-semibold uppercase tracking-[0.24em] text-primary/80">
      Career Command Center
    </p>
    <div class="mt-1 flex min-w-0 items-center gap-2">
      <h1 class="truncate text-base font-semibold tracking-tight text-foreground sm:text-lg">
        {{ currentSection() }}
      </h1>
      <span
        class="hidden rounded-full border border-primary/25 bg-primary/10 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-[0.16em] text-primary sm:inline-flex"
      >
        Live
      </span>
    </div>

    <nav hlmBreadcrumb class="mt-1 hidden lg:block" aria-label="Breadcrumb">
      <ol hlmBreadcrumbList>
        <li hlmBreadcrumbItem>
          <a hlmBreadcrumbLink [link]="'/dashboard'">Dashboard</a>
        </li>
        @for (breadcrumb of breadcrumbService.breadcrumbs(); track breadcrumb.url; let last = $last) {
          <li hlmBreadcrumbSeparator></li>
          <li hlmBreadcrumbItem>
            @if (last) {
              <span hlmBreadcrumbPage>{{ breadcrumb.label }}</span>
            } @else {
              <a hlmBreadcrumbLink [link]="breadcrumb.url">{{ breadcrumb.label }}</a>
            }
          </li>
        }
      </ol>
    </nav>
  </div>

  <div class="hidden items-center justify-center lg:flex">
    <button
      (click)="isOpen.set(true)"
      hlmBtn
      variant="outline"
      type="button"
      class="group relative h-12 w-full justify-start overflow-hidden rounded-2xl border-border/70 bg-background/60 px-4 text-left text-sm font-normal text-muted-foreground shadow-none transition-all hover:border-primary/35 hover:bg-muted/40 hover:text-foreground"
    >
      <div
        class="absolute inset-y-1 left-2 right-16 rounded-2xl bg-linear-to-r from-primary/10 via-transparent to-transparent opacity-0 blur-xl transition-opacity group-hover:opacity-100"
      ></div>
      <ng-icon hlm name="lucideSearch" class="relative z-10 mr-3 h-4 w-4" />
      <div class="relative z-10 flex min-w-0 flex-1 items-center justify-between gap-3">
        <span class="truncate">Search pipeline or ask Career Copilot...</span>
        <span
          class="inline-flex items-center gap-2 rounded-full border border-border/80 bg-card/80 px-2 py-1 text-[10px] font-semibold uppercase tracking-[0.18em] text-primary"
        >
          AI
        </span>
      </div>
      <kbd
        class="pointer-events-none absolute right-2 top-2.5 hidden h-7 select-none items-center gap-1 rounded-xl border border-border/80 bg-muted/70 px-2 font-mono text-[10px] font-medium text-muted-foreground sm:flex"
      >
        <span class="text-xs">Ctrl</span>K
      </kbd>
    </button>
  </div>

  <div class="flex items-center justify-end gap-2">
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      type="button"
      (click)="isOpen.set(true)"
      class="h-10 w-10 rounded-xl border border-transparent hover:border-border lg:hidden"
      aria-label="Open command menu"
    >
      <ng-icon hlm name="lucideSearch" class="h-4 w-4" />
    </button>

    <button
      hlmBtn
      variant="ghost"
      size="icon"
      type="button"
      (click)="uiService.openAddAppSheet()"
      class="h-10 w-10 rounded-xl border border-transparent hover:border-border hover:bg-muted/60"
      aria-label="Add application"
    >
      <ng-icon hlm name="lucidePlus" class="h-5 w-5" />
    </button>

    <button
      hlmBtn
      variant="ghost"
      size="icon"
      type="button"
      (click)="uiService.toggleAiDrawer()"
      class="h-10 w-10 rounded-xl border border-transparent hover:border-border hover:bg-muted/60"
      [class.text-primary]="uiService.isAiDrawerOpen()"
      aria-label="Toggle AI Assistant"
    >
      <ng-icon hlm name="lucideSparkles" class="h-5 w-5" />
    </button>

    <app-notification-center />
    <app-theme-toggle />

    <button
      hlmBtn
      variant="ghost"
      type="button"
      (click)="openSettings()"
      class="hidden h-10 items-center gap-3 rounded-2xl border border-border/70 bg-background/60 px-2.5 hover:border-primary/30 hover:bg-muted/50 xl:flex"
    >
      <span
        class="flex h-8 w-8 items-center justify-center rounded-xl bg-primary text-xs font-bold text-primary-foreground"
      >
        {{ authService.userInitials() }}
      </span>
      <span class="min-w-0 text-left">
        <span class="block max-w-[10rem] truncate text-sm font-semibold text-foreground">
          {{ authService.userFullName() || 'Operator' }}
        </span>
        <span
          class="block text-[10px] font-semibold uppercase tracking-[0.18em] text-muted-foreground"
        >
          Elite Plan
        </span>
      </span>
    </button>
  </div>

  <hlm-dialog [state]="isOpen() ? 'open' : 'closed'" (closed)="isOpen.set(false)">
    <ng-template brnDialogContent>
      <hlm-dialog-content
        hlmCommandDialog
        class="z-100 max-w-[90vw] overflow-hidden border border-border bg-popover/95 p-0 shadow-2xl backdrop-blur-xl md:max-w-2xl dark:shadow-primary/5"
      >
        <hlm-command hlmClassName="bg-transparent border-none">
          <input
            hlmCommandSearchInput
            placeholder="Type a command, route, or ask AI..."
            class="h-12 border-b border-border"
          />
          <hlm-command-list hlmClassName="max-h-[300px] overflow-y-auto scrollbar-hide py-2 px-2">
            <div *hlmCommandEmptyState hlmCommandEmpty class="py-6 text-center text-sm text-muted-foreground">
              No results found.
            </div>

            <hlm-command-group label="Workspace">
              <button hlmCommandItem value="dashboard" (click)="navigateTo('/dashboard')">
                <ng-icon hlm name="lucideCommand" hlmCommandIcon />
                <span>Open Dashboard</span>
              </button>
              <button hlmCommandItem value="applications" (click)="navigateTo('/applications')">
                <ng-icon hlm name="lucideCalculator" hlmCommandIcon />
                <span>Open Application Pipeline</span>
              </button>
              <button hlmCommandItem value="companies" (click)="navigateTo('/companies')">
                <ng-icon hlm name="lucideCalendar" hlmCommandIcon />
                <span>Open Company Database</span>
              </button>
            </hlm-command-group>

            <hlm-command-separator />

            <hlm-command-group label="Actions">
              <button hlmCommandItem value="profile" (click)="navigateTo('/profile')">
                <ng-icon hlm name="lucideUser" hlmCommandIcon />
                <span>Profile</span>
                <hlm-command-shortcut>Ctrl+P</hlm-command-shortcut>
              </button>
              <button
                hlmCommandItem
                value="copilot"
                (click)="uiService.openAddAppSheet(); isOpen.set(false)"
              >
                <ng-icon hlm name="lucideMail" hlmCommandIcon />
                <span>Add New Application</span>
                <hlm-command-shortcut>Ctrl+N</hlm-command-shortcut>
              </button>
              <button hlmCommandItem value="settings" (click)="openSettings()">
                <ng-icon hlm name="lucideSettings" hlmCommandIcon />
                <span>Settings</span>
                <hlm-command-shortcut>Ctrl+S</hlm-command-shortcut>
              </button>
            </hlm-command-group>

            <hlm-command-separator />

            <hlm-command-group label="AI Assistant">
              <button hlmCommandItem value="ai-open" (click)="openAiDrawer()">
                <ng-icon hlm name="lucideSparkles" hlmCommandIcon />
                <span>Open AI Assistant</span>
              </button>
              <button hlmCommandItem value="ai-summary" (click)="openAiDrawer()">
                <ng-icon hlm name="lucideBrain" hlmCommandIcon />
                <span>Pipeline Summary</span>
              </button>
              <button hlmCommandItem value="ai-next" (click)="openAiDrawer()">
                <ng-icon hlm name="lucideZap" hlmCommandIcon />
                <span>Next Best Action</span>
              </button>
            </hlm-command-group>
          </hlm-command-list>
        </hlm-command>
      </hlm-dialog-content>
    </ng-template>
  </hlm-dialog>
</div>
