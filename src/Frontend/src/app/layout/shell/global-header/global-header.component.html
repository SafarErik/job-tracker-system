<div
  class="grid w-full grid-cols-[minmax(0,1fr)_minmax(18rem,30rem)_auto] items-center gap-3"
>
  <div class="min-w-0">
    <h1 class="truncate text-base font-semibold tracking-tight text-foreground sm:text-lg">
      {{ pageTitle() }}
    </h1>
    <p class="mt-1 truncate text-sm text-muted-foreground">
      {{ pageDescription() }}
    </p>
  </div>

  <div class="hidden items-center justify-center lg:flex">
    <button
      (click)="isOpen.set(true)"
      hlmBtn
      variant="outline"
      type="button"
      class="group relative h-11 w-full justify-start overflow-hidden rounded-2xl border-border/70 bg-background/60 px-4 text-left text-sm font-normal text-muted-foreground shadow-none transition-all hover:border-primary/35 hover:bg-muted/40 hover:text-foreground"
    >
      <ng-icon hlm name="lucideSearch" class="mr-3 h-4 w-4" />
      <span class="truncate pr-16">Search pipeline or ask Career Copilot...</span>
      <span
        class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 rounded-full border border-border/80 bg-card/80 px-2 py-1 text-[10px] font-medium text-muted-foreground"
      >
        Ctrl+K
      </span>
    </button>
  </div>

  <div class="flex items-center justify-end gap-2">
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      type="button"
      (click)="isOpen.set(true)"
      class="h-10 w-10 rounded-xl border border-transparent hover:border-border lg:hidden"
      aria-label="Open command menu"
    >
      <ng-icon hlm name="lucideSearch" class="h-4 w-4" />
    </button>

    <app-notification-center />

    <button
      [hlmDropdownMenuTrigger]="userMenu"
      hlmBtn
      variant="ghost"
      type="button"
      class="hidden h-10 items-center gap-3 rounded-2xl border border-border/70 bg-background/60 px-2.5 hover:border-primary/30 hover:bg-muted/50 lg:flex"
    >
      <span
        class="flex h-8 w-8 items-center justify-center rounded-xl bg-primary text-xs font-bold text-primary-foreground"
      >
        {{ authService.userInitials() }}
      </span>
      <span class="min-w-0 text-left">
        <span class="block max-w-[10rem] truncate text-sm font-semibold text-foreground">
          {{ authService.userFullName() || 'Operator' }}
        </span>
        <span
          class="block text-[10px] font-semibold uppercase tracking-[0.18em] text-muted-foreground"
        >
          Elite Plan
        </span>
      </span>
      <ng-icon hlm name="lucideChevronDown" class="h-4 w-4 text-muted-foreground" />
    </button>
  </div>

  <hlm-dialog [state]="isOpen() ? 'open' : 'closed'" (closed)="isOpen.set(false)">
    <ng-template brnDialogContent>
      <hlm-dialog-content
        hlmCommandDialog
        class="z-100 max-w-[90vw] overflow-hidden border border-border bg-popover/95 p-0 shadow-2xl backdrop-blur-xl md:max-w-2xl dark:shadow-primary/5"
      >
        <hlm-command hlmClassName="bg-transparent border-none">
          <input
            hlmCommandSearchInput
            placeholder="Type a command, route, or ask AI..."
            class="h-12 border-b border-border"
          />
          <hlm-command-list hlmClassName="max-h-[300px] overflow-y-auto scrollbar-hide py-2 px-2">
            <div *hlmCommandEmptyState hlmCommandEmpty class="py-6 text-center text-sm text-muted-foreground">
              No results found.
            </div>

            <hlm-command-group label="Workspace">
              <button hlmCommandItem value="dashboard" (click)="navigateTo('/dashboard')">
                <ng-icon hlm name="lucideCommand" hlmCommandIcon />
                <span>Open Command Center</span>
              </button>
              <button hlmCommandItem value="applications" (click)="navigateTo('/applications')">
                <ng-icon hlm name="lucideCalculator" hlmCommandIcon />
                <span>Open Application Pipeline</span>
              </button>
              <button hlmCommandItem value="companies" (click)="navigateTo('/companies')">
                <ng-icon hlm name="lucideCalendar" hlmCommandIcon />
                <span>Open Company Database</span>
              </button>
            </hlm-command-group>

            <hlm-command-separator />

            <hlm-command-group label="Actions">
              <button hlmCommandItem value="profile" (click)="navigateTo('/profile')">
                <ng-icon hlm name="lucideUser" hlmCommandIcon />
                <span>Profile</span>
                <hlm-command-shortcut>Ctrl+P</hlm-command-shortcut>
              </button>
              <button
                hlmCommandItem
                value="copilot"
                (click)="uiService.openAddAppSheet(); isOpen.set(false)"
              >
                <ng-icon hlm name="lucideMail" hlmCommandIcon />
                <span>Add New Application</span>
                <hlm-command-shortcut>Ctrl+N</hlm-command-shortcut>
              </button>
              <button hlmCommandItem value="settings" (click)="openSettings()">
                <ng-icon hlm name="lucideSettings" hlmCommandIcon />
                <span>Settings</span>
                <hlm-command-shortcut>Ctrl+S</hlm-command-shortcut>
              </button>
            </hlm-command-group>

            <hlm-command-separator />

            <hlm-command-group label="AI Assistant">
              <button hlmCommandItem value="ai-open" (click)="openAiDrawer()">
                <ng-icon hlm name="lucideSparkles" hlmCommandIcon />
                <span>Open AI Assistant</span>
              </button>
              <button hlmCommandItem value="ai-summary" (click)="openAiDrawer()">
                <ng-icon hlm name="lucideBrain" hlmCommandIcon />
                <span>Pipeline Summary</span>
              </button>
              <button hlmCommandItem value="ai-next" (click)="openAiDrawer()">
                <ng-icon hlm name="lucideZap" hlmCommandIcon />
                <span>Next Best Action</span>
              </button>
            </hlm-command-group>
          </hlm-command-list>
        </hlm-command>
      </hlm-dialog-content>
    </ng-template>
  </hlm-dialog>

  <ng-template #userMenu>
    <div
      hlmDropdownMenu
      class="w-64 rounded-2xl border border-border bg-popover/95 p-2 shadow-2xl backdrop-blur-xl animate-in fade-in zoom-in-95"
    >
      <div class="flex items-center gap-3 px-2 py-2">
        <span
          class="flex h-9 w-9 items-center justify-center rounded-xl bg-primary text-xs font-bold text-primary-foreground"
        >
          {{ authService.userInitials() }}
        </span>
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold text-foreground">
            {{ authService.userFullName() || 'Operator' }}
          </p>
          <p class="truncate text-[10px] font-semibold uppercase tracking-[0.18em] text-muted-foreground">
            Elite Plan
          </p>
        </div>
      </div>

      <div hlmDropdownMenuSeparator hlmClassName="bg-border/50"></div>

      <div hlmDropdownMenuGroup>
        <button hlmDropdownMenuItem (click)="navigateTo('/profile')" hlmClassName="rounded-lg">
          <ng-icon hlm name="lucideUser" hlmDropdownMenuIcon />
          <span>Profile</span>
        </button>
        <button hlmDropdownMenuItem (click)="openSettings()" hlmClassName="rounded-lg">
          <ng-icon hlm name="lucideSettings" hlmDropdownMenuIcon />
          <span>Settings</span>
        </button>
      </div>

      <div hlmDropdownMenuSeparator hlmClassName="bg-border/50"></div>

      <div class="px-2 py-1">
        <p class="text-[10px] font-bold uppercase tracking-[0.22em] text-muted-foreground">Theme</p>
      </div>
      <div hlmDropdownMenuGroup>
        <button hlmDropdownMenuItem (click)="setTheme('light')" hlmClassName="rounded-lg">
          <ng-icon hlm name="lucideSun" hlmDropdownMenuIcon />
          <span>Light</span>
        </button>
        <button hlmDropdownMenuItem (click)="setTheme('dark')" hlmClassName="rounded-lg">
          <ng-icon hlm name="lucideMoon" hlmDropdownMenuIcon />
          <span>Dark</span>
        </button>
        <button hlmDropdownMenuItem (click)="setTheme('system')" hlmClassName="rounded-lg">
          <ng-icon hlm name="lucideLaptop" hlmDropdownMenuIcon />
          <span>System</span>
        </button>
      </div>

      <div hlmDropdownMenuSeparator hlmClassName="bg-border/50"></div>

      <button
        hlmDropdownMenuItem
        (click)="logout()"
        class="rounded-lg text-destructive focus:bg-destructive/10 focus:text-destructive"
      >
        <ng-icon hlm name="lucideLogOut" hlmDropdownMenuIcon />
        <span>Log out</span>
      </button>
    </div>
  </ng-template>
</div>
