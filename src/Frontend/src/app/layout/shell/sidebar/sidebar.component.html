<hlm-sidebar
  collapsible="icon"
  variant="sidebar"
  class="h-full border-r border-sidebar-border bg-sidebar transition-[width,background-color,border-color,color] duration-200 ease-in-out"
>
  <div
    hlmSidebarHeader
    class="overflow-hidden border-b border-sidebar-border/80 px-4 py-4 whitespace-nowrap transition-all duration-300 group-data-[collapsible=icon]:px-0 group-data-[collapsible=icon]:justify-center"
  >
    <div
      class="flex w-full items-center gap-3 overflow-hidden rounded-2xl border border-sidebar-border/70 bg-sidebar-accent/35 px-3 py-3 transition-all group-data-[collapsible=icon]:w-12 group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:rounded-2xl group-data-[collapsible=icon]:border-none group-data-[collapsible=icon]:bg-transparent group-data-[collapsible=icon]:px-0"
    >
      <app-logo class="transition-all duration-300" size="sm" [withGlow]="true"></app-logo>
      <div class="min-w-0 group-data-[collapsible=icon]:hidden">
        <p class="truncate text-xs font-semibold uppercase tracking-[0.22em] text-sidebar-foreground/55">
          Horizon OS
        </p>
        <p class="truncate text-sm font-semibold text-sidebar-foreground">Career command layer</p>
      </div>
    </div>
  </div>

  <div hlmSidebarContent>
    <div hlmSidebarGroup class="px-2 py-3">
      <div
        hlmSidebarGroupLabel
        hlmClassName="mb-2 px-3 text-[10px] font-bold uppercase tracking-[0.24em] text-sidebar-foreground/45"
      >
        Workspace
      </div>
      <div hlmSidebarGroupContent>
        <ul hlmSidebarMenu class="px-0">
          @for (item of navItems; track item.label) {
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                [routerLink]="item.link"
                routerLinkActive="bg-sidebar-primary/12 text-sidebar-foreground border-sidebar-primary/30 shadow-[0_12px_30px_hsl(var(--sidebar-primary)/0.08)]"
                [routerLinkActiveOptions]="{ exact: item.exact }"
                class="group mb-1 flex justify-start rounded-2xl border border-transparent px-3 py-3 text-sidebar-foreground/72 transition-all hover:border-sidebar-border hover:bg-sidebar-accent/65 hover:text-sidebar-accent-foreground group-data-[collapsible=icon]:!justify-center group-data-[collapsible=icon]:h-11 group-data-[collapsible=icon]:w-11 group-data-[collapsible=icon]:rounded-xl group-data-[collapsible=icon]:px-0"
              >
                <ng-icon
                  hlm
                  [name]="item.icon"
                  hlmClassName="h-5 w-5 shrink-0 transition-colors group-hover:text-sidebar-primary"
                />
                <div class="min-w-0 group-data-[collapsible=icon]:hidden">
                  <span class="block truncate text-sm font-semibold">{{ item.label }}</span>
                  <span class="block truncate text-[11px] text-sidebar-foreground/45">
                    {{ item.description }}
                  </span>
                </div>
              </a>
            </li>
          }
        </ul>
      </div>
    </div>

    <div class="px-4 pb-4 pt-2 group-data-[collapsible=icon]:hidden">
      <div class="rounded-[1.6rem] border border-sidebar-border/70 bg-sidebar-accent/35 p-4">
        <p class="text-[10px] font-semibold uppercase tracking-[0.22em] text-sidebar-foreground/45">
          AI Assist
        </p>
        <p class="mt-2 text-sm font-semibold text-sidebar-foreground">
          Use Copilot to draft follow-ups and next-step plans faster.
        </p>
      </div>
    </div>
  </div>

  <div
    hlmSidebarFooter
    class="overflow-hidden border-t border-sidebar-border p-4 group-data-[collapsible=icon]:p-2!"
  >
    <div class="flex w-full items-center gap-3 group-data-[collapsible=icon]:justify-center">
      <button
        [hlmDropdownMenuTrigger]="userMenu"
        hlmBtn
        variant="ghost"
        class="group relative flex h-auto w-full items-center justify-start gap-3 rounded-xl border border-transparent p-2 transition-all hover:border-sidebar-border hover:bg-sidebar-accent group-data-[collapsible=icon]:justify-center! group-data-[collapsible=icon]:gap-0 group-data-[collapsible=icon]:h-12 group-data-[collapsible=icon]:w-12 group-data-[collapsible=icon]:p-0"
      >
        <ng-icon
          hlm
          name="lucideChevronUp"
          hlmClassName="hidden group-data-[collapsible=icon]:block absolute -top-2 text-sidebar-foreground/60"
        />
        <hlm-avatar
          hlmClassName="h-8 w-8 rounded-lg ring-2 ring-sidebar-border group-data-[collapsible=icon]:h-9 group-data-[collapsible=icon]:w-9"
        >
          <span hlmAvatarFallback hlmClassName="bg-primary text-primary-foreground text-[10px]">{{
            authService.userInitials() || 'JD'
          }}</span>
        </hlm-avatar>
        <div class="flex-1 text-left group-data-[collapsible=icon]:hidden">
          <p class="text-sm font-semibold text-sidebar-foreground">
            {{ authService.userFullName() || 'User' }}
          </p>
          <p class="text-[10px] font-medium uppercase tracking-[0.2em] text-sidebar-foreground/50">
            Elite Plan
          </p>
        </div>
        <ng-icon
          hlm
          name="lucideChevronUp"
          hlmClassName="w-4 h-4 text-sidebar-foreground/50 group-data-[collapsible=icon]:hidden group-hover:text-sidebar-foreground transition-colors"
        />
      </button>
    </div>
  </div>

  <button hlmSidebarRail></button>
</hlm-sidebar>

<ng-template #userMenu>
  <div
    hlmDropdownMenu
    class="w-64 rounded-2xl border border-border bg-popover/95 p-2 shadow-2xl backdrop-blur-xl animate-in fade-in zoom-in-95"
  >
    <div
      hlmDropdownMenuLabel
      hlmClassName="px-2 py-1.5 text-xs font-bold text-muted-foreground uppercase tracking-widest"
    >
      Account Settings
    </div>
    <div hlmDropdownMenuSeparator hlmClassName="bg-border/50"></div>

    <div hlmDropdownMenuGroup>
      <button hlmDropdownMenuItem routerLink="/profile" hlmClassName="rounded-lg">
        <ng-icon hlm name="lucideUser" hlmDropdownMenuIcon />
        <span>Profile</span>
        <span hlmDropdownMenuShortcut>Ctrl+P</span>
      </button>
      <button
        hlmDropdownMenuItem
        (click)="uiService.openProfileSettings()"
        hlmClassName="rounded-lg"
      >
        <ng-icon hlm name="lucideSettings" hlmDropdownMenuIcon />
        <span>Settings</span>
        <span hlmDropdownMenuShortcut>Ctrl+S</span>
      </button>
    </div>

    <div hlmDropdownMenuSeparator hlmClassName="bg-border/50"></div>

    <button
      hlmDropdownMenuItem
      (click)="onLogout()"
      class="rounded-lg text-destructive focus:bg-destructive/10 focus:text-destructive"
    >
      <ng-icon hlm name="lucideLogOut" hlmDropdownMenuIcon />
      <span>Log out</span>
    </button>
  </div>
</ng-template>
