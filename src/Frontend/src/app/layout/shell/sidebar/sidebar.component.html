<hlm-sidebar
  collapsible="icon"
  variant="sidebar"
  class="h-full border-r border-sidebar-border bg-sidebar transition-[width,background-color,border-color,color] duration-200 ease-in-out"
>
  <div
    hlmSidebarHeader
    class="overflow-hidden border-b border-sidebar-border/80 px-4 py-4 whitespace-nowrap transition-all duration-300 group-data-[collapsible=icon]:px-0 group-data-[collapsible=icon]:justify-center"
  >
    <div
      class="flex w-full items-center gap-3 overflow-hidden rounded-2xl border border-sidebar-border/70 bg-sidebar-accent/35 px-3 py-3 transition-all group-data-[collapsible=icon]:w-12 group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:rounded-2xl group-data-[collapsible=icon]:border-none group-data-[collapsible=icon]:bg-transparent group-data-[collapsible=icon]:px-0"
    >
      <app-logo class="transition-all duration-300" size="sm" [withGlow]="true"></app-logo>
      <div class="min-w-0 group-data-[collapsible=icon]:hidden">
        <p class="truncate text-sm font-semibold text-sidebar-foreground">Horizon</p>
        <p class="truncate text-xs text-sidebar-foreground/55">Career workspace</p>
      </div>
    </div>
  </div>
  <div hlmSidebarContent>
    <div hlmSidebarGroup class="px-2 py-3">
      <div
        hlmSidebarGroupLabel
        hlmClassName="mb-2 px-3 text-[10px] font-bold uppercase tracking-[0.24em] text-sidebar-foreground/45"
      >
        Workspace
      </div>
      <div hlmSidebarGroupContent>
        <ul hlmSidebarMenu class="px-0">
          @for (item of navItems; track item.label) {
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                [routerLink]="item.link"
                routerLinkActive="bg-sidebar-primary/12 text-sidebar-foreground border-sidebar-primary/30 shadow-[0_12px_30px_hsl(var(--sidebar-primary)/0.08)]"
                [routerLinkActiveOptions]="{ exact: item.exact }"
                class="group mb-1 flex justify-start rounded-2xl border border-transparent px-3 py-3 text-sidebar-foreground/72 transition-all hover:border-sidebar-border hover:bg-sidebar-accent/65 hover:text-sidebar-accent-foreground group-data-[collapsible=icon]:!justify-center group-data-[collapsible=icon]:h-11 group-data-[collapsible=icon]:w-11 group-data-[collapsible=icon]:rounded-xl group-data-[collapsible=icon]:px-0"
              >
                <ng-icon
                  hlm
                  [name]="item.icon"
                  hlmClassName="h-5 w-5 shrink-0 transition-colors group-hover:text-sidebar-primary"
                />
                <span class="block truncate text-sm font-semibold group-data-[collapsible=icon]:hidden">
                  {{ item.label }}
                </span>
              </a>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>

  <button hlmSidebarRail></button>
</hlm-sidebar>
